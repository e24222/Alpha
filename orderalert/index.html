<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單狀況通報 — 龍冶</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pri:#2563eb;--pri-d:#1d4ed8;--ok:#16a34a;--err:#dc2626;--warn:#d97706;--bg:#f1f5f9;--card:#fff;--bdr:#cbd5e1;--tx:#1e293b;--mu:#64748b}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','微軟正黑體',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{background:#0f172a;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:1.1rem;font-weight:700}
.top a{color:#93c5fd;font-size:.85rem;text-decoration:none}
.top .sp{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:.9rem;font-weight:600;background:var(--pri);color:#fff}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--bdr)}
.btn.sec:hover{background:#f8fafc}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.del{background:#fff;color:var(--err);border:1px solid #fecaca}
.tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px 8px 0 0;border:1px solid var(--bdr);border-bottom:none;background:#e2e8f0;font-weight:600;color:var(--mu)}
.tab.on{background:var(--card);color:var(--pri)}
.tab .n{background:var(--err);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 7px;margin-left:6px}
.tabs .sp{flex:1}
.tabs input[type=search]{padding:7px 12px;border:1px solid var(--bdr);border-radius:8px;font-size:.9rem;width:220px}
.panel{background:var(--card);border:1px solid var(--bdr);border-radius:0 10px 10px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#f1f5f9;text-align:left;padding:9px 10px;border-bottom:2px solid var(--bdr);white-space:nowrap;font-weight:700}
td{padding:8px 10px;border-bottom:1px solid #e2e8f0;vertical-align:top}
tr.head td{background:#f8fafc;border-top:2px solid var(--bdr);font-weight:600}
tr.head .meta{font-weight:400;color:var(--mu);font-size:.8rem;margin-left:8px}
.note{white-space:pre-wrap;color:#92400e;background:#fffbeb;border-radius:6px;padding:6px 10px;font-size:.88rem}
.bell{color:var(--warn);font-size:.8rem;margin-left:8px;font-weight:400}
.empty{padding:40px;text-align:center;color:var(--mu)}
.act{white-space:nowrap;text-align:right}
.ck{width:18px;height:18px;vertical-align:middle;cursor:pointer}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px;z-index:50}
.mask.on{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:820px;padding:22px}
.modal h2{font-size:1.1rem;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.fg label{font-size:.8rem;color:var(--mu);font-weight:600}
input,select,textarea{font-family:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--bdr);border-radius:8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--pri)}
.cust{display:flex;gap:6px}
.cust select{width:70px}
.cname{font-size:.85rem;margin-top:2px;min-height:1.2em}
.cname.ok{color:var(--ok);font-weight:600}.cname.bad{color:var(--err)}
.items{width:100%;margin-bottom:8px}
.items th{background:#f1f5f9;font-size:.82rem}
.items td{padding:4px;border:none}
.items input{padding:6px 8px}
.items .x{background:none;border:none;color:var(--err);font-size:1.1rem}
.remind{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;margin:12px 0}
.remind .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.remind select{width:auto}
.remind .hint{font-size:.82rem;color:var(--mu);margin-top:6px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.rcpt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:#e0e7ff;border-radius:99px;padding:4px 6px 4px 12px;font-size:.85rem;display:flex;align-items:center;gap:4px}
.chip button{border:none;background:none;color:var(--err);font-size:1rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:8px;display:none;z-index:99}
/* gate */
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e3a8a);display:flex;align-items:center;justify-content:center;z-index:200}
#gate div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:32px;text-align:center;color:#fff;min-width:280px}
#gate input{text-align:center;letter-spacing:4px;margin:14px 0 8px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
#gate .e{color:#f87171;font-size:.85rem;display:none}
@media(max-width:640px){.wrap{padding:10px}.tabs input[type=search]{width:100%}}
</style>
</head>
<body>

<div id="gate"><div>
  <h2>🔒 系統登入</h2>
  <p style="opacity:.6;font-size:.85rem">請輸入密碼以繼續</p>
  <input id="gpw" type="password" placeholder="••••" autofocus>
  <button class="btn" style="width:100%" id="gbtn">進入</button>
  <div class="e" id="gerr">密碼錯誤，請重試</div>
</div></div>

<div class="top">
  <h1>📝 訂單狀況通報</h1>
  <a href="../index.html">← 回首頁</a>
  <span class="sp"></span>
  <button class="btn sec sm" id="btnRcpt">📧 提醒收件人</button>
  <button class="btn sec sm" id="btnCsv">⬇ 匯出 CSV</button>
  <button class="btn" id="btnNew">＋ 新增通報</button>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tabP" data-t="p">待處理<span class="n" id="cntP" style="display:none"></span></button>
    <button class="tab" id="tabD" data-t="d">已處理</button>
    <span class="sp"></span>
    <input type="search" id="q" placeholder="搜尋客編 / 公司 / 貨號 / 品名 / 說明">
  </div>
  <div class="panel" id="list"><div class="empty">載入中…</div></div>
</div>

<!-- 新增 / 編輯 -->
<div class="mask" id="mForm"><div class="modal">
  <h2 id="fTitle">新增通報</h2>
  <div class="row">
    <div class="fg" style="max-width:240px"><label>客編</label>
      <div class="cust"><select id="fCo"><option>AL</option><option>GM</option></select>
      <input id="fCid" placeholder="輸入後按 Enter" autocomplete="off"></div>
      <div class="cname" id="fCname"></div>
    </div>
    <div class="fg"><label>公司名稱（自動帶入）</label><input id="fCnm" placeholder="找不到時可手動輸入"></div>
    <div class="fg" style="max-width:150px"><label>通報人</label><input id="fPoster" placeholder="業務姓名"></div>
  </div>

  <table class="items"><thead><tr>
    <th style="width:150px">預交日期</th><th style="width:150px">貨號</th><th>品名</th><th style="width:100px">數量</th><th style="width:30px"></th>
  </tr></thead><tbody id="fItems"></tbody></table>
  <button class="btn sec sm" id="fAdd">＋ 新增品項</button>

  <div class="fg" style="margin-top:14px"><label>狀況說明</label><textarea id="fNote" rows="3" placeholder="例如：客戶要求提早交貨、原料短缺、需改包裝…"></textarea></div>

  <div class="remind">
    <div class="line">
      <label style="display:flex;gap:6px;align-items:center;font-weight:600"><input type="checkbox" class="ck" id="fRm" style="width:18px"> 需要 Email 提醒</label>
      <span id="fRmBox" style="display:none">貼文後
        <select id="fDays"></select> 天，早上 9:00 寄出
      </span>
    </div>
    <div class="hint" id="fRmHint">不勾選就不會寄信。</div>
  </div>

  <div class="foot">
    <button class="btn sec" id="fCancel">取消</button>
    <button class="btn" id="fSave">儲存</button>
  </div>
</div></div>

<!-- 收件人 -->
<div class="mask" id="mRcpt"><div class="modal" style="max-width:480px">
  <h2>📧 提醒收件人</h2>
  <div style="font-size:.85rem;color:var(--mu)">有勾選「需要 Email 提醒」的通報，到期時會寄給下列所有信箱。</div>
  <div class="rcpt" id="rList"></div>
  <div class="cust"><input id="rIn" type="email" placeholder="name@example.com"><button class="btn" id="rAdd" style="white-space:nowrap">新增</button></div>
  <div class="foot"><button class="btn sec" id="rClose">關閉</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
var PW='22505047',KEY='sysauth_orderalert',TTL=30*24*60*60*1000;
var gate=document.getElementById('gate');
function authed(){var t=localStorage.getItem(KEY);return t&&(Date.now()-parseInt(t))<TTL;}
function tryPw(){
  if(document.getElementById('gpw').value===PW){localStorage.setItem(KEY,String(Date.now()));gate.style.display='none';}
  else{document.getElementById('gerr').style.display='block';document.getElementById('gpw').value='';}
}
if(authed())gate.style.display='none';
document.getElementById('gbtn').onclick=tryPw;
document.getElementById('gpw').onkeydown=function(e){if(e.key==='Enter')tryPw();};
})();

var SUPA='https://achrezfjtyjjgoyaaowr.supabase.co';
var KEY_='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjaHJlemZqdHlqamdveWFhb3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NzgwMTgsImV4cCI6MjA5MjQ1NDAxOH0.pZtQzdp02UduK8R0Tm_PykA9hTsbCb7Z0Bmslg_rsrQ';
function api(path,opt){
  opt=opt||{};
  return fetch(SUPA+'/rest/v1/'+path,{method:opt.method||'GET',body:opt.body?JSON.stringify(opt.body):undefined,headers:{
    apikey:KEY_,Authorization:'Bearer '+KEY_,'Content-Type':'application/json',Prefer:opt.prefer||'return=minimal'}});
}
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none';},2200);}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(base,n){var d=new Date(base);d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d;}

var tab='p', rows=[], editing=null;

// ───────── 載入 / 顯示 ─────────
async function load(){
  $('list').innerHTML='<div class="empty">載入中…</div>';
  var done=tab==='d';
  var r=await api('order_notes?done=eq.'+done+'&order='+(done?'done_at':'created_at')+'.desc&limit='+(done?200:500),{prefer:'return=representation'});
  if(!r.ok){$('list').innerHTML='<div class="empty">載入失敗（'+r.status+'）</div>';return;}
  rows=await r.json();
  render();
  if(!done){var n=rows.length;$('cntP').textContent=n;$('cntP').style.display=n?'':'none';}
}
function render(){
  var q=$('q').value.trim().toLowerCase();
  var list=rows.filter(function(o){
    if(!q)return true;
    var s=[o.cust_id,o.cust_name,o.company,o.note,o.poster].concat((o.items||[]).map(function(i){return [i.part,i.name].join(' ');})).join(' ').toLowerCase();
    return s.indexOf(q)>=0;
  });
  if(!list.length){$('list').innerHTML='<div class="empty">'+(tab==='p'?'目前沒有待處理的通報':'沒有已處理的紀錄')+'</div>';return;}
  var h='<table><thead><tr><th style="width:40px">已處理</th><th>預交日期</th><th>客編</th><th>貨號</th><th>品名</th><th>數量</th><th></th></tr></thead><tbody>';
  list.forEach(function(o){
    var items=o.items&&o.items.length?o.items:[{}];
    var bell=o.remind_on?('<span class="bell">🔔 '+(o.reminded_at?'已寄出':o.remind_on.replace(/-/g,'/')+' 09:00 提醒')+'</span>'):'';
    var d=new Date(o.created_at);
    h+='<tr class="head"><td colspan="7">'+esc((o.company?o.company+' ':'')+o.cust_id)+'　'+esc(o.cust_name)+
       '<span class="meta">'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+(o.poster?' · '+esc(o.poster):'')+'</span>'+bell+'</td></tr>';
    items.forEach(function(it,i){
      h+='<tr>'+(i===0?'<td rowspan="'+(items.length+(o.note?1:0))+'"><input type="checkbox" class="ck" data-done="'+o.id+'"'+(o.done?' checked':'')+'></td>':'')+
         '<td>'+esc(it.due||'').replace(/-/g,'/')+'</td><td>'+(i===0?esc(o.cust_id):'')+'</td><td>'+esc(it.part)+'</td><td>'+esc(it.name)+'</td><td>'+esc(it.qty)+'</td>'+
         (i===0?'<td class="act" rowspan="'+(items.length+(o.note?1:0))+'"><button class="btn sec sm" data-edit="'+o.id+'">編輯</button> <button class="btn del sm" data-del="'+o.id+'">刪除</button></td>':'')+'</tr>';
    });
    if(o.note)h+='<tr><td colspan="5"><div class="note">'+esc(o.note)+'</div></td></tr>';
  });
  $('list').innerHTML=h+'</tbody></table>';
}
$('list').onclick=async function(e){
  var t=e.target,id;
  if(id=t.getAttribute('data-edit'))openForm(rows.find(function(o){return o.id===id;}));
  else if(id=t.getAttribute('data-del')){
    if(!confirm('確定刪除這筆通報？'))return;
    var r=await api('order_notes?id=eq.'+id,{method:'DELETE'});
    if(r.ok){toast('已刪除');load();}else toast('刪除失敗');
  }
};
$('list').onchange=async function(e){
  var id=e.target.getAttribute('data-done');if(!id)return;
  var v=e.target.checked;
  var r=await api('order_notes?id=eq.'+id,{method:'PATCH',body:{done:v,done_at:v?new Date().toISOString():null}});
  if(r.ok){toast(v?'已移到「已處理」':'已移回「待處理」');load();}else{toast('更新失敗');e.target.checked=!v;}
};
function setTab(t){tab=t;$('tabP').classList.toggle('on',t==='p');$('tabD').classList.toggle('on',t==='d');load();}
$('tabP').onclick=function(){setTab('p');};
$('tabD').onclick=function(){setTab('d');};
$('q').oninput=render;

// ───────── 新增 / 編輯表單 ─────────
for(var i=1;i<=60;i++){var op=document.createElement('option');op.value=i;op.textContent=i;$('fDays').appendChild(op);}
function itemRow(it){
  it=it||{};
  var tr=document.createElement('tr');
  tr.innerHTML='<td><input type="date" class="i-due" value="'+esc(it.due||'')+'"></td>'+
    '<td><input class="i-part" value="'+esc(it.part||'')+'"></td>'+
    '<td><input class="i-name" value="'+esc(it.name||'')+'"></td>'+
    '<td><input class="i-qty" inputmode="numeric" value="'+esc(it.qty||'')+'"></td>'+
    '<td><button class="x" type="button" title="刪除此列">✕</button></td>';
  tr.querySelector('.x').onclick=function(){if($('fItems').children.length>1)tr.remove();else tr.querySelectorAll('input').forEach(function(i){i.value='';});};
  tr.querySelector('.i-qty').onkeydown=function(e){if(e.key==='Enter'&&tr===$('fItems').lastElementChild){$('fItems').appendChild(itemRow());$('fItems').lastElementChild.querySelector('.i-due').focus();}};
  return tr;
}
$('fAdd').onclick=function(){$('fItems').appendChild(itemRow());};
function openForm(o){
  editing=o||null;
  $('fTitle').textContent=o?'編輯通報':'新增通報';
  $('fCo').value=o&&o.company||'AL';
  $('fCid').value=o&&o.cust_id||'';
  $('fCnm').value=o&&o.cust_name||'';
  $('fCname').textContent='';$('fCname').className='cname';
  $('fPoster').value=o?(o.poster||''):(localStorage.getItem('oa_poster')||'');
  $('fNote').value=o&&o.note||'';
  $('fItems').innerHTML='';
  ((o&&o.items&&o.items.length)?o.items:[{},{},{}]).forEach(function(it){$('fItems').appendChild(itemRow(it));});
  $('fRm').checked=!!(o&&o.remind_days);
  $('fDays').value=(o&&o.remind_days)||3;
  syncRemind();
  $('mForm').classList.add('on');
  if(!o)$('fCid').focus();
}
function syncRemind(){
  var on=$('fRm').checked;
  $('fRmBox').style.display=on?'':'none';
  var base=editing?editing.created_at:new Date();
  $('fRmHint').textContent=on?('將於 '+ymd(addDays(base,+$('fDays').value)).replace(/-/g,'/')+' 早上 9:00 寄給所有提醒收件人；勾選「已處理」後就不會再寄。'):'不勾選就不會寄信。';
}
$('fRm').onchange=syncRemind;$('fDays').onchange=syncRemind;
$('btnNew').onclick=function(){openForm(null);};
$('fCancel').onclick=function(){$('mForm').classList.remove('on');};

// 客編 → 公司名稱（只查單筆，不下載整張客戶表）
function normId(s){s=s.trim().toUpperCase();if(/^\d+$/.test(s))s=s.padStart(3,'0');return s;}
async function lookup(){
  var raw=$('fCid').value;if(!raw.trim())return;
  var id=normId(raw);$('fCid').value=id;
  var r=await api('customers?company=eq.'+$('fCo').value+'&id=eq.'+encodeURIComponent(id)+'&select=name',{prefer:'return=representation'});
  var d=r.ok?await r.json():[];
  if(d.length){$('fCnm').value=d[0].name;$('fCname').textContent='✓ '+d[0].name;$('fCname').className='cname ok';}
  else{$('fCname').textContent='找不到此客編（'+$('fCo').value+'），可換公司別或手動輸入名稱';$('fCname').className='cname bad';}
}
$('fCid').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();lookup();}};
$('fCid').onblur=lookup;
$('fCo').onchange=lookup;

$('fSave').onclick=async function(){
  var cid=normId($('fCid').value);
  var items=[].map.call($('fItems').children,function(tr){return {
    due:tr.querySelector('.i-due').value,part:tr.querySelector('.i-part').value.trim(),
    name:tr.querySelector('.i-name').value.trim(),qty:tr.querySelector('.i-qty').value.trim()};
  }).filter(function(i){return i.due||i.part||i.name||i.qty;});
  if(!cid){toast('請輸入客編');return;}
  if(!items.length&&!$('fNote').value.trim()){toast('請至少填一個品項或狀況說明');return;}
  var rm=$('fRm').checked,days=+$('fDays').value;
  var base=editing?editing.created_at:new Date();
  var body={company:$('fCo').value,cust_id:cid,cust_name:$('fCnm').value.trim(),poster:$('fPoster').value.trim(),
    note:$('fNote').value.trim(),items:items,
    remind_days:rm?days:null,remind_on:rm?ymd(addDays(base,days)):null};
  if(editing&&(editing.remind_on||null)!==body.remind_on)body.reminded_at=null;
  localStorage.setItem('oa_poster',body.poster);
  $('fSave').disabled=true;
  var r=editing?await api('order_notes?id=eq.'+editing.id,{method:'PATCH',body:body}):await api('order_notes',{method:'POST',body:body});
  $('fSave').disabled=false;
  if(r.ok){$('mForm').classList.remove('on');toast('已儲存');load();}else toast('儲存失敗（'+r.status+'）');
};

// ───────── 提醒收件人 ─────────
async function loadRcpt(){
  var r=await api('order_note_recipients?order=created_at',{prefer:'return=representation'});
  var d=r.ok?await r.json():[];
  $('rList').innerHTML=d.length?d.map(function(x){return '<span class="chip">'+esc(x.email)+'<button data-rm="'+esc(x.email)+'">✕</button></span>';}).join(''):'<span style="color:var(--mu);font-size:.85rem">尚未設定收件人</span>';
}
$('btnRcpt').onclick=function(){$('mRcpt').classList.add('on');loadRcpt();};
$('rClose').onclick=function(){$('mRcpt').classList.remove('on');};
$('rAdd').onclick=async function(){
  var v=$('rIn').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){toast('Email 格式不正確');return;}
  var r=await api('order_note_recipients',{method:'POST',body:{email:v},prefer:'resolution=ignore-duplicates,return=minimal'});
  if(r.ok){$('rIn').value='';loadRcpt();}else toast('新增失敗');
};
$('rIn').onkeydown=function(e){if(e.key==='Enter')$('rAdd').click();};
$('rList').onclick=async function(e){
  var m=e.target.getAttribute('data-rm');if(!m)return;
  await api('order_note_recipients?email=eq.'+encodeURIComponent(m),{method:'DELETE'});loadRcpt();
};

// ───────── 匯出 CSV（備份用，含待處理與已處理）─────────
$('btnCsv').onclick=async function(){
  var r=await api('order_notes?order=created_at.desc&limit=5000',{prefer:'return=representation'});
  if(!r.ok){toast('匯出失敗');return;}
  var d=await r.json();
  var out=[['通報時間','狀態','公司別','客編','公司名稱','通報人','預交日期','貨號','品名','數量','狀況說明','提醒日']];
  d.forEach(function(o){
    var its=o.items&&o.items.length?o.items:[{}];
    its.forEach(function(i,k){out.push([new Date(o.created_at).toLocaleString('zh-TW',{hour12:false}),o.done?'已處理':'待處理',o.company,o.cust_id,o.cust_name,o.poster,i.due,i.part,i.name,i.qty,k===0?o.note:'',o.remind_on||'']);});
  });
  var csv='﻿'+out.map(function(r){return r.map(function(c){c=c==null?'':String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='訂單狀況通報_'+ymd(new Date())+'.csv';a.click();
};

load();
</script>
</body>
</html>
